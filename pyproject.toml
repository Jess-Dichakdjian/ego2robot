[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ego2robot"
version = "0.1.0"
description = "Retarget human manipulation demonstrations to robot simulation tasks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.22"]

[tool.setuptools.packages.find]
where = ["src"]
